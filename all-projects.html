<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Works | huraru's Portfolio</title>
  <meta name="description" content="huraru の全作品アーカイブ">
  <meta name="author" content="huraru">

  <link rel="icon" type="image/png" href="images/favicon.png">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/skill.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/works.css">
  <link rel="stylesheet" href="css/media.css">

  <script src="js/vendor/marked.min.js" defer></script>
  <script src="js/Sunrise_Sunset.js" defer></script>
  <script src="js/Theme.js" defer></script>
  <script src="js/Modal.js" defer></script>
  <script src="js/dotMotion.js" defer></script>
  <script src="js/work-parser.js" defer></script>
  <script src="js/work-renderer.js" defer></script>
  <script src="js/works-app.js" defer></script>
</head>

<body>
  <div class="decorative-lines">
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>

  <div class="dots-pattern"></div>
  <div class="barcode"></div>

  <div class="geometric-shape shape-1"></div>
  <div class="geometric-shape shape-2"></div>
  <div class="geometric-shape shape-3"></div>

  <header>
    <nav>
      <a href="index.html" class="logo">PORTFOLIO</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">TOP</a></li>
        <li><a href="index.html#about">ABOUT</a></li>
        <li><a href="index.html#featured-works">WORKS</a></li>
        <li><a href="index.html#skill">SKILL</a></li>
      </ul>
      <div class="nav-actions">
        <button class="hamburger" id="hamburger" aria-label="メニューを開く">
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
          <span class="hamburger-line"></span>
        </button>
        <button id="theme-toggle" class="theme-toggle">
          <span class="icon sun">☀</span>
          <span class="icon moon">🌙</span>
        </button>
      </div>
    </nav>
  </header>

  <section class="section" id="projects">
    <div class="container">
      <h2 class="section-title">ALL WORKS</h2>

      <div class="tag-filter" id="tagFilter"></div>

      <div class="project-grid" id="projectGrid"></div>
    </div>
  </section>

  <footer id="contact">
    <p class="footer-text">
      CONTACT: <span class="footer-email">hurarunium@gmail.com</span>
    </p>
    <p class="footer-copyright">
      2025 this portfolio is designed by huraru.
    </p>
  </footer>

  <div id="work-modal" class="work-modal">
    <div class="work-modal-inner">
      <button class="work-modal-close" onclick="closeWorkModal()">×</button>
      <h2 class="p-title"></h2>
      <div class="p-tags"></div>
      <div class="p-body"></div>
    </div>
  </div>

  <script>
    const hamburger = document.getElementById('hamburger');
    const navLinks = document.getElementById('navLinks');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      navLinks.classList.toggle('open');
    });

    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        navLinks.classList.remove('open');
      });
    });
  </script>
</body>

</html>
